blueprint:
  name: s42 - Intelligente Rollladensteuerung V2 (ein Rollladen pro Automation)
  description: >
    Steuert einen einzelnen Rollladen anhand "seines" Fensters: morgendliches Öffnen,
    Reaktion auf gekippte/geöffnete Fenster inkl. Rückfahr-Logik, Nachtmodus, Sturmschutz,
    automatische Beschattung anhand des Sonnenstands (Sonnenschutz, optional mit Filter
    nach Wetterlage), Sonnenheizen (das Gegenteil: öffnet in der Heizperiode
    heruntergelassene/vergessene Rollläden bei Sonne und Kälte), ein Moskito-Modus,
    der beim Öffnen des Fensters nach Sonnenuntergang die Lichter im Raum ausschaltet,
    sowie ein Abwesenheitsmodus (schließen, wenn niemand zuhause ist, und beim
    Heimkommen wieder öffnen).


    Pro Fenster/Rollladen wird eine eigene Automation aus diesem Blueprint erstellt.
    Gemeinsame Helfer (z.B. das input_datetime für morgens oder der Nachtmodus-Helfer)
    werden einfach in allen Instanzen identisch ausgewählt.


    📖 [Ausführliche Dokumentation & FAQ](https://github.com/TheRealSimon42/ha-blueprints/blob/main/docs/cover_automation_v2.md)
  domain: automation
  author: TheRealSimon42
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://raw.githubusercontent.com/TheRealSimon42/ha-blueprints/main/automations/cover_automation_v2.yaml
  input:
    assignment_section:
      name: Zuordnung
      description: >
        Der Rollladen und der zugehörige Fenstersensor. Nur der Rollladen ist
        ein Pflichtfeld — ohne Fenstersensor entfallen lediglich die
        fensterbezogenen Funktionen.
      icon: mdi:vector-link
      input:
        cover:
          name: Rollladen
          description: Der Rollladen, den diese Automation steuert.
          selector:
            entity:
              domain: cover
        window_sensor:
          name: Fenstersensor (optional)
          description: >
            Der Fensterkontakt zu diesem Rollladen. Unterstützt werden klassische
            binäre Fensterkontakte (offen/geschlossen) ebenso wie
            Drei-Zustands-Sensoren mit offen/gekippt/geschlossen. Hinweis: Binäre
            Kontakte erscheinen in der Auswahl nur mit passender Geräteklasse
            (Tür, Fenster, Öffnung oder Garagentor) — die lässt sich in den
            Einstellungen der Entität nachrüsten.
            Kann bei festverglasten Fenstern ohne Kontakt leer bleiben: Alle
            Zeit-, Sonnen- und Sturm-Funktionen laufen dann ganz normal, nur die
            fensterbezogenen Features (Fenster-Interaktion, Benachrichtigungen,
            Moskito-Modus, Lüftungs-Rücksichten) bleiben aus.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class:
                    - door
                    - window
                    - opening
                    - garage_door
                - domain: sensor
    morning_section:
      name: Morgens öffnen
      description: Einstellungen für das automatische Öffnen am Morgen.
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morning_enabled:
          name: Morgens öffnen aktivieren
          default: true
          selector:
            boolean: {}
        morning_time:
          name: Uhrzeit für morgendliches Hochfahren
          description: >
            Ein input_datetime-Helfer mit der Uhrzeit für das Hochfahren
            (erforderlich, wenn "Morgens öffnen" aktiviert ist).
            Wichtig: einen Helfer, der NUR eine Uhrzeit enthält (ohne Datum) —
            ein Datum+Uhrzeit-Helfer feuert nur ein einziges Mal an genau diesem
            Datum und danach nie wieder. In allen Blueprint-Instanzen denselben
            Helfer auswählen. Ist zusätzlich "Mit dem Sonnenaufgang öffnen"
            aktiviert, wird diese Uhrzeit zur Untergrenze ("frühestens ab").
          default: []
          selector:
            entity:
              domain: input_datetime
        morning_use_sun:
          name: Mit dem Sonnenaufgang öffnen
          description: >
            Wenn aktiviert, öffnet der Rollladen zum Sonnenaufgang (plus/minus
            Verschiebung, nächstes Feld) — aber nie vor der oben eingestellten
            Uhrzeit. Es gilt also der SPÄTERE der beiden Zeitpunkte: Im Sommer
            schützt die Uhrzeit vor dem 5-Uhr-Sonnenaufgang, im Winter wartet
            das Öffnen auf die tatsächliche Helligkeit. Ohne gesetzte Uhrzeit
            zählt allein der Sonnenaufgang. Ein aktiver Nachtmodus hat Vorrang —
            liegt der Öffnungszeitpunkt noch im Nacht-Block, wird beim Ende des
            Nachtmodus nachgeholt.
          default: false
          selector:
            boolean: {}
        morning_sun_offset:
          name: Verschiebung zum Sonnenaufgang
          description: >
            Verschiebt das sonnenaufgangs-gesteuerte Öffnen in Minuten:
            negative Werte öffnen vor, positive nach dem Sonnenaufgang.
          default: 0
          selector:
            number:
              min: -120
              max: 120
              step: 5
              mode: slider
              unit_of_measurement: min
        morning_motion_sensor:
          name: Morgens nur bei Bewegung öffnen (optional)
          description: >
            Für selten genutzte Räume (Gästezimmer, Hobbyraum): Ist hier ein
            Bewegungs-/Präsenzsensor ausgewählt, öffnet der Rollladen morgens
            NICHT automatisch zur Uhrzeit, sondern erst bei der ersten Bewegung
            im Raum — frühestens zur eingestellten Uhrzeit bzw. nach
            Sonnenaufgang und nur solange der Rollladen noch geschlossen ist.
            Wird der Raum den ganzen Tag nicht betreten, bleibt er unten.
            Leer lassen für normales zeitgesteuertes Öffnen.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
        morning_position:
          name: Zielposition für morgens
          description: >
            Die Position (in %), auf die der Rollladen morgens fährt. Es wird nur
            gefahren, wenn der Rollladen geschlossener ist als diese Position.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    window_interaction_section:
      name: Fenster-Interaktion
      description: Wie der Rollladen auf geöffnete oder gekippte Fenster reagiert.
      icon: mdi:window-open-variant
      collapsed: true
      input:
        tilted_position:
          name: Zielposition für gekipptes Fenster
          description: >
            Die Position (in %), auf die der Rollladen fährt, wenn das Fenster gekippt
            wird. Es wird nur gefahren, wenn der Rollladen geschlossener ist.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        reclose_timeout:
          name: Zeitfenster für automatisches Zurückfahren
          description: >
            Wird das Fenster innerhalb dieser Zeit wieder geschlossen, fährt der
            Rollladen in seine Ausgangsposition zurück.
          default: 30
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        force_close:
          name: Schließen erzwingen
          description: >
            Wenn aktiviert, wird der Rollladen nach Ablauf des Zeitfensters immer
            geschlossen, auch wenn das Fenster noch offen ist.
            ⚠️ Achtung: Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
        treat_open_as_tilted:
          name: Öffnen wie Kippen behandeln
          description: >
            Für Fenster mit einfachem binärem Kontakt (nur offen/geschlossen), die
            im Alltag praktisch immer nur gekippt werden — z.B. das Badfenster.
            Wenn aktiviert, wird jedes "offen" wie "gekippt" behandelt: Der
            Rollladen fährt beim Öffnen auf die Kipp-Position statt komplett auf,
            auch der Nachtmodus nutzt die Kipp-Position, und die Beschattung läuft
            weiter (mit der Kipp-Position als Lüftungsspalt), statt bei offenem
            Fenster zu pausieren. Benachrichtigungen melden weiterhin "offen" —
            das entspricht dem, was der Sensor tatsächlich sieht.
          default: false
          selector:
            boolean: {}
    window_geometry_section:
      name: Fenstergeometrie & Sonnenausrichtung
      description: >
        Ausrichtung und Sichtfeld des Fensters. Diese Werte bestimmen, wann die Sonne
        geometrisch "ins Fenster scheint" — sowohl für den Sonnenschutz (Beschattung)
        als auch für Sonnenheizen. Wird nur eines der beiden Features genutzt, müssen
        die Werte trotzdem hier gesetzt werden.


        Zur Bedeutung von Ausrichtung und Sichtfeld:

        ![Erklärgrafik Sichtfeld](https://cdn.jsdelivr.net/gh/TheRealSimon42/ha-blueprints@main/images/sichtfeld_beschattung.svg)
      icon: mdi:sun-compass
      collapsed: true
      input:
        window_azimuth:
          name: Ausrichtung des Fensters
          description: >
            Himmelsrichtung, in die das Fenster zeigt, in Grad
            (0 = Nord, 90 = Ost, 180 = Süd, 270 = West).
          default: 180
          selector:
            number:
              min: 0
              max: 359
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_fov_left:
          name: Sichtfeld links
          description: >
            Wie weit die Sonne seitlich links von der Fensterausrichtung stehen darf
            und noch als "scheint ins Fenster" gilt. 90° ist das geometrische Maximum —
            die Sonne steht dann genau in der Fassadenebene und kann das Fenster gerade
            noch treffen. Nur verkleinern, wenn auf dieser Seite ein Hindernis die Sonne
            blockiert (tiefe Laibung, Balkon, Nachbarhaus). Links/rechts gilt von innen
            am Fenster stehend mit Blick nach draußen — bei einem Südfenster ist links
            die Vormittagsseite (Osten).
          default: 90
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_fov_right:
          name: Sichtfeld rechts
          description: >
            Wie Sichtfeld links, nur rechts der Fensterausrichtung — bei einem
            Südfenster die Nachmittags-/Abendseite (Westen).
          default: 90
          selector:
            number:
              min: 0
              max: 90
              step: 1
              mode: slider
              unit_of_measurement: °
        shading_min_elevation:
          name: Minimale Sonnenhöhe
          description: >
            Unterhalb dieser Sonnenhöhe (Elevation in Grad) gilt die Sonne als nicht
            "im Fenster" (weder für Sonnenschutz noch für Sonnenheizen), z.B. weil
            Nachbargebäude oder Bäume die tiefe Sonne ohnehin blockieren.
          default: 0
          selector:
            number:
              min: 0
              max: 45
              step: 1
              mode: slider
              unit_of_measurement: °
    shading_section:
      name: Sonnenschutz (Beschattung)
      description: >
        Fährt den Rollladen anhand des Sonnenstands automatisch so weit herunter, dass
        die Sonne höchstens bis zur eingestellten Tiefe in den Raum scheint — und wieder
        hoch, sobald die Sonne nicht mehr ins Fenster scheint oder es abgekühlt ist.
        Sehr schräg einfallende Sonne wird dabei automatisch berücksichtigt: je flacher
        der Winkel, desto weiter oben bleibt der Rollladen. Wird der Rollladen während
        der Beschattung manuell verfahren, erkennt die Automation das und lässt ihn bis
        zum Beschattungs-Ende in Ruhe. Ausrichtung und Sichtfeld werden im Abschnitt
        "Fenstergeometrie & Sonnenausrichtung" eingestellt.
        ⚠️ Benötigt einen eigenen input_boolean-Helfer pro Fenster als Status-Speicher.
      icon: mdi:sun-wireless
      collapsed: true
      input:
        shading_enabled:
          name: Sonnenschutz aktivieren
          description: >
            Benötigt zwingend den Status-Helfer (nächstes Feld) sowie die Werte im
            Abschnitt "Fenstergeometrie & Sonnenausrichtung". Fehlt der Helfer,
            erinnert eine dauerhafte Benachrichtigung in Home Assistant daran.
          default: false
          selector:
            boolean: {}
        shading_status_helper:
          name: Status-Helfer (input_boolean)
          description: >
            Erforderlich für den Sonnenschutz: ein input_boolean-Helfer NUR für dieses
            Fenster. Er merkt sich, ob die Beschattung aktiv ist, damit der Rollladen
            danach zuverlässig wieder geöffnet wird (auch über Neustarts hinweg).
          default: []
          selector:
            entity:
              domain: input_boolean
        shading_weather_states:
          name: Wetterlagen für Beschattung (optional)
          description: >
            Beschattet wird nur, wenn die Wetter-Entität (siehe Sturmschutz weiter
            unten) eine dieser Wetterlagen meldet — praktisch, um z.B. bei "bewölkt"
            trotz rechnerisch passendem Sonnenstand nicht unnötig zu beschatten.
            Leer lassen, um die Wetterlage zu ignorieren (Standardverhalten wie
            bisher — nur Sonnenstand und Temperatur zählen). Ohne gesetzte
            Wetter-Entität wird dieser Filter ignoriert, auch wenn hier Werte
            ausgewählt sind.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
                - value: sunny
                  label: "☀️ Sonnig"
                - value: partlycloudy
                  label: "⛅ Teilweise bewölkt"
                - value: cloudy
                  label: "☁️ Bewölkt"
                - value: clear-night
                  label: "🌙 Klare Nacht"
                - value: fog
                  label: "🌫️ Nebel"
                - value: windy
                  label: "💨 Windig"
                - value: windy-variant
                  label: "💨 Windig mit Wolken"
                - value: rainy
                  label: "🌧️ Regnerisch"
                - value: pouring
                  label: "🌧️ Starkregen"
                - value: lightning
                  label: "⛈️ Gewitter"
                - value: lightning-rainy
                  label: "⛈️ Gewitter mit Regen"
                - value: hail
                  label: "🌨️ Hagel"
                - value: snowy
                  label: "❄️ Schnee"
                - value: snowy-rainy
                  label: "🌨️ Schneeregen"
                - value: exceptional
                  label: "⚠️ Außergewöhnlich"
        shading_enable_entity:
          name: Freigabe-Entität für die Beschattung (optional)
          description: >
            Beschattet wird nur, wenn diese Entität "on" ist — der universelle
            Haken für eigene Zusatzbedingungen: PV-Überschuss, Helligkeit
            (Lux-Schwelle), Anwesenheit auf der Terrasse, Raumtemperatur …
            einfach als Template-Binärsensor oder Helfer abbilden und hier
            auswählen (Beispiele in der Doku). Geht die Entität während
            laufender Beschattung stabil auf "aus", endet die Beschattung.
            Leer lassen = Beschattung ohne Zusatzbedingung. Bei "unavailable"
            startet keine neue Beschattung; eine laufende bleibt bestehen.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: binary_sensor
        window_height:
          name: Fensterhöhe
          description: Höhe der Glasfläche in Metern.
          default: 1.3
          selector:
            number:
              min: 0.3
              max: 3.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        window_sill_height:
          name: Brüstungshöhe
          description: Höhe der Fensterunterkante über dem Fußboden in Metern (bei bodentiefen Fenstern 0).
          default: 0.9
          selector:
            number:
              min: 0
              max: 2.5
              step: 0.05
              mode: box
              unit_of_measurement: m
        shading_depth:
          name: Maximale Sonneneinfall-Tiefe
          description: >
            Wie weit die Sonne maximal in den Raum scheinen darf (auf dem Fußboden
            gemessen, ab Fensterebene). Kleinere Werte = strengere Beschattung;
            bei sehr kleinen Werten fährt der Rollladen praktisch komplett zu.
          default: 1.0
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              mode: box
              unit_of_measurement: m
        glass_bottom_position:
          name: Aufsetz-Punkt (Glas-Kalibrierung)
          description: >
            Die Position (in %), bei der der Panzer gerade auf Fensterbank oder
            Boden aufsitzt und das Glas komplett abgedeckt ist — darunter schließen
            sich nur noch die Lamellen. Zum Ermitteln den Rollladen langsam
            herunterfahren, bis der Lichtspalt unten gerade verschwindet, und die
            Position ablesen. Mit gesetztem Wert rechnet die Beschattung in echter
            Glasfläche und fährt nie tiefer als diesen Punkt — die Lamellen bleiben
            offen. 0 = Motor-Position wird direkt als Glasfläche interpretiert
            (bisheriges Verhalten).
          default: 0
          selector:
            number:
              min: 0
              max: 50
              step: 1
              mode: slider
              unit_of_measurement: "%"
        glass_top_position:
          name: Oberer Glas-Endpunkt (Glas-Kalibrierung)
          description: >
            Die Position (in %), bei der das Glas gerade komplett frei ist —
            darüber wird der Panzer nur noch in den Kasten eingezogen. Meist nahe
            100 und deutlich unwichtiger als der Aufsetz-Punkt. Muss über dem
            Aufsetz-Punkt liegen, sonst wird die Kalibrierung ignoriert.
          default: 100
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_min_position:
          name: Minimale Beschattungsposition
          description: >
            Tiefer als diese Position fährt die Beschattung nicht (z.B. 10 %, damit
            immer etwas Tageslicht bleibt). 0 = ganz schließen erlaubt.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_end_position:
          name: Position nach der Beschattung
          description: Position, auf die nach Ende der Beschattung gefahren wird.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_temp_sensor:
          name: Außentemperatur-Sensor (optional)
          description: >
            Optionaler Temperatursensor für die Beschattungs-Bedingung. Wenn leer,
            wird die Temperatur der Wetter-Entität aus dem Sturmschutz verwendet —
            eines von beiden muss gesetzt sein, sonst startet die Beschattung nie.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature
        shading_temp_threshold:
          name: Temperatur-Schwelle
          description: Beschattet wird nur, wenn die Außentemperatur über diesem Wert liegt.
          default: 25
          selector:
            number:
              min: 10
              max: 40
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_temp_hysteresis:
          name: Temperatur-Hysterese
          description: >
            Die Beschattung endet erst, wenn die Temperatur um diesen Wert unter die
            Schwelle gefallen ist (verhindert ständiges Auf und Ab).
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_min_change:
          name: Minimale Positionsänderung
          description: >
            Der Rollladen wird beim Nachführen nur bewegt, wenn sich die Zielposition
            um mindestens diesen Wert von der aktuellen unterscheidet (schont den Motor).
          default: 5
          selector:
            number:
              min: 1
              max: 25
              step: 1
              mode: slider
              unit_of_measurement: "%"
        shading_override_threshold:
          name: Toleranz für manuelle Eingriffe
          description: >
            Weicht die Ist-Position während laufender Beschattung um mehr als diesen
            Wert von der berechneten Sollposition ab, wertet die Automation das als
            manuellen Eingriff und lässt den Rollladen in Ruhe — bis die Beschattung
            endet und normal wieder geöffnet wird. Kleinere Abweichungen gelten als
            normales Nachführen der Sonne.
          default: 20
          selector:
            number:
              min: 10
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: "%"
        force_shading:
          name: Beschattung erzwingen
          description: >
            Wenn aktiviert, wird auch bei komplett geöffnetem Fenster beschattet —
            praktisch, damit es nicht aufheizt, wenn man das Fenster mal vergisst.
            Als Lüftungsspalt bleibt dabei mindestens die Kipp-Position stehen.
            ⚠️ Achtung: Für Balkon- und Terrassentüren nicht empfohlen — Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    solar_heating_section:
      name: Sonnenheizen (Winter)
      description: >
        Das Gegenteil des Sonnenschutzes: Öffnet einen heruntergelassenen (z.B.
        vergessenen) Rollladen automatisch, wenn die Sonne laut Sonnenstand ins
        Fenster scheint und es draußen kalt ist — damit die Sonne kostenlos beim
        Aufheizen des Raums hilft. Nutzt dieselbe Fensterausrichtung/Sichtfeld wie
        der Sonnenschutz (Abschnitt "Fenstergeometrie & Sonnenausrichtung"), läuft
        aber unabhängig davon, ob der Sonnenschutz selbst aktiviert ist.
        Der Sturmschutz hat immer Vorrang — bei Starkwind greift Sonnenheizen nicht.
        ⚠️ Benötigt einen EIGENEN input_boolean-Helfer (nicht denselben wie der
        Sonnenschutz-Helfer!).
      icon: mdi:sun-thermometer
      collapsed: true
      input:
        solar_heating_enabled:
          name: Sonnenheizen aktivieren
          description: >
            Benötigt zwingend den Status-Helfer (nächstes Feld) sowie die Werte im
            Abschnitt "Fenstergeometrie & Sonnenausrichtung". Fehlt der Helfer,
            erinnert eine dauerhafte Benachrichtigung in Home Assistant daran.
          default: false
          selector:
            boolean: {}
        solar_heating_status_helper:
          name: Status-Helfer (input_boolean)
          description: >
            Erforderlich für Sonnenheizen: ein eigener input_boolean-Helfer NUR für
            dieses Fenster (separat vom Sonnenschutz-Helfer). Verhindert, dass ein
            manuell wieder heruntergelassener Rollladen im selben Zeitraum erneut
            aufgedrängt wird — erst wenn die Bedingungen (Sonne/Temperatur) einmal
            enden und neu eintreten, öffnet Sonnenheizen wieder.
          default: []
          selector:
            entity:
              domain: input_boolean
        solar_heating_temp_threshold:
          name: Temperatur-Schwelle
          description: >
            Sonnenheizen greift nur, wenn die Außentemperatur unter diesem Wert
            liegt (Heizperiode). Nutzt denselben Temperatursensor bzw. dieselbe
            Wetter-Entität wie der Sonnenschutz (Außentemperatur-Sensor bzw.
            Wetter-Entität aus dem Sturmschutz-Abschnitt).
            ⚠️ Sollte deutlich unter der Beschattungs-Temperatur-Schwelle liegen,
            damit sich Sonnenschutz und Sonnenheizen bei überlappenden Werten nicht
            widersprechen (gleichzeitig schließen und öffnen wollen).
          default: 12
          selector:
            number:
              min: -10
              max: 20
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_temp_hysteresis:
          name: Temperatur-Hysterese
          description: >
            Sonnenheizen endet erst, wenn die Temperatur um diesen Wert über die
            Schwelle gestiegen ist (verhindert ständiges Auf und Ab).
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        solar_heating_min_position:
          name: Grenzwert "heruntergelassen"
          description: >
            Der Rollladen gilt erst unterhalb dieser Position als "heruntergelassen"
            und wird nur dann durch Sonnenheizen geöffnet (verhindert unnötiges
            Nachfahren bei einem bereits fast offenen Rollladen).
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        solar_heating_position:
          name: Zielposition
          description: >
            Position (in %), auf die der Rollladen beim Sonnenheizen geöffnet wird.
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    mosquito_section:
      name: Moskito-Modus
      description: >
        Schaltet die Lichter im Raum aus, wenn das Fenster nach Einbruch der Dunkelheit
        geöffnet oder gekippt wird — damit das Licht keine Insekten anlockt.
        Benötigt einen Fenstersensor.
      icon: mdi:bug
      collapsed: true
      input:
        mosquito_enabled:
          name: Moskito-Modus aktivieren
          default: false
          selector:
            boolean: {}
        mosquito_area:
          name: Bereich (optional)
          description: >
            Der Bereich, dessen Lichter ausgeschaltet werden. Wenn leer, wird
            automatisch der Bereich des Fenstersensors verwendet.
          default: ""
          selector:
            area: {}
        mosquito_exclude:
          name: Ausnahmen
          description: >
            Diese Lichter bleiben an (z.B. eine rote Stehlampe fürs Baby).
          default: []
          selector:
            entity:
              domain: light
              multiple: true
        mosquito_after_time:
          name: Frühestens ab (optional)
          description: >
            Zusätzliche Zeitbedingung: Der Moskito-Modus greift erst ab dieser Uhrzeit
            (und nur, wenn die Sonne unter dem Horizont ist). 00:00:00 = keine Einschränkung.
          default: "00:00:00"
          selector:
            time: {}
    night_mode_section:
      name: Nachtmodus
      description: Schließen der Rollläden bei Nacht über einen gemeinsamen Helfer.
      icon: mdi:weather-night
      collapsed: true
      input:
        night_mode_boolean:
          name: Nachtmodus-Helfer (optional)
          description: >
            Wird diese Entität eingeschaltet, fährt der Rollladen für die Nacht
            herunter. Neben einem input_boolean funktioniert auch ein
            Zeitplan-Helfer (Schedule, z.B. "22:00 bis 06:30" — die Rollläden
            schließen dann automatisch zum Blockbeginn) oder ein beliebiger
            Binärsensor (z.B. ein Template-Sensor "Sonne unter Horizont" für
            das Schließen bei Sonnenuntergang). Endet der Nachtmodus, wird ein
            von ihm blockiertes morgendliches Öffnen (Uhrzeit/Sonnenaufgang)
            nachgeholt. Leer lassen, wenn kein Nachtmodus gewünscht ist. In
            allen Blueprint-Instanzen dieselbe Entität auswählen.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: schedule
                - domain: binary_sensor
        night_position:
          name: Zielposition für nachts
          description: >
            Die Position (in %), auf die der Nachtmodus bei geschlossenem
            Fenster fährt. 0 = komplett schließen (Standard). Werte über 0
            lassen z.B. die Lamellen offen — dafür muss der Rollladen
            Positionsangaben unterstützen, sonst wird komplett geschlossen.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        night_ventilation_position:
          name: Nachtposition bei offenem Fenster
          description: >
            Position (in %), auf die nachts gefahren wird, wenn das Fenster komplett
            offen ist. Bei gekipptem Fenster wird die Kipp-Position verwendet.
          default: 15
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    away_section:
      name: Abwesenheit
      description: >
        Reagiert darauf, dass niemand mehr zuhause ist: Rollladen beim Verlassen
        schließen, beim Heimkommen tagsüber wieder öffnen und während der
        Abwesenheit strenger beschatten. Morgens-Öffnen und Nachtmodus laufen
        auch während der Abwesenheit normal weiter — im Urlaub fahren die
        Rollläden damit weiter im Tagesrhythmus, statt tagelang unten zu bleiben.
        Ohne Anwesenheits-Entitäten ist dieser Abschnitt wirkungslos.
      icon: mdi:home-export-outline
      collapsed: true
      input:
        presence_entities:
          name: Anwesenheits-Entitäten
          description: >
            Woran die Automation erkennt, ob jemand zuhause ist — z.B. Personen,
            Geräte-Tracker, eine Personen-Gruppe, die Zone "Zuhause" oder ein
            eigener Anwesenheits-Helfer. Als abwesend gilt das Haus erst, wenn
            ALLE ausgewählten Entitäten "weg" melden: Personen/Tracker nicht
            "home", Gruppen/Binärsensoren/Helfer nicht "on"/"home", Zonen mit 0
            Personen. Eine nicht verfügbare oder unbekannte Entität zählt als
            anwesend (lieber einmal nicht schließen als unerwartet fahren) —
            deshalb nur Personen mit zugeordnetem Tracker auswählen.
            Leer = Abwesenheitsfunktionen aus. In allen Blueprint-Instanzen
            dieselben Entitäten auswählen.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - person
                    - device_tracker
                    - group
                    - zone
                    - binary_sensor
                    - input_boolean
        away_delay:
          name: Wartezeit bis "abwesend"
          description: >
            So lange müssen alle ununterbrochen weg sein, bevor die Abwesenheit
            gilt — verhindert Fahrten, wenn jemand nur kurz zum Briefkasten geht
            oder ein Tracker kurz aussetzt. Das Heimkommen wirkt dagegen sofort.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        away_close_enabled:
          name: Bei Abwesenheit schließen
          description: >
            Fährt den Rollladen auf die Abwesenheits-Position (nächstes Feld),
            sobald alle für die Wartezeit weg sind — nur abwärts, nicht während
            einer Pause, und bei Sturm hat der Sturmschutz Vorrang. Solange
            niemand zuhause ist und der Rollladen unten steht, öffnen ihn auch
            Sonnenschutz und Sonnenheizen nicht. Kommt nach einer echten
            Abwesenheit jemand zurück, steht der Rollladen noch auf oder unter der
            Abwesenheits-Position (egal wer ihn dorthin gefahren hat) und ist es
            weder Nacht (Nachtmodus-Helfer an) noch dunkel, öffnet er auf die
            Zielposition für morgens (bei Frost begrenzt wie morgens; ist für
            morgens ein Bewegungssensor gesetzt und steht der Rollladen tief genug
            für das Bewegungs-Öffnen, öffnet erst die erste Bewegung im Raum); die
            Beschattung bewertet danach der nächste Durchlauf neu.
            ⚠️ Aussperr-Schutz: Ist das Fenster bzw. die Tür offen oder gekippt,
            wird nicht geschlossen — vielleicht steht doch jemand ohne Handy auf
            dem Balkon. Der Schutz braucht einen Fenstersensor; ohne ihn gilt das
            Fenster als geschlossen.
          default: false
          selector:
            boolean: {}
        away_close_position:
          name: Position bei Abwesenheit
          description: >
            Die Position (in %), auf die der Rollladen bei Abwesenheit fährt. Es
            wird nur gefahren, wenn der Rollladen offener ist als diese Position.
            0 = ganz schließen.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
        away_shading_strict:
          name: Strenger beschatten bei Abwesenheit
          description: >
            Solange niemand zuhause ist, gilt für den Sonnenschutz die maximale
            Sonneneinfall-Tiefe aus dem nächsten Feld statt der normalen —
            mehr Hitzeschutz, wenn ein dunklerer Raum niemanden stört. Wirkt ab
            Ablauf der Wartezeit bis zum Heimkommen und braucht den aktivierten
            Sonnenschutz.
          default: false
          selector:
            boolean: {}
        away_shading_depth:
          name: Maximale Sonneneinfall-Tiefe bei Abwesenheit
          description: >
            Wie die maximale Sonneneinfall-Tiefe im Sonnenschutz, gilt aber nur
            während der Abwesenheit. Ist die normale Tiefe bereits kleiner, bleibt
            es bei der normalen.
          default: 0.3
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              mode: box
              unit_of_measurement: m
    storm_protection_section:
      name: Sturmschutz
      description: Fährt den Rollladen bei starkem Wind hoch (oder im Panzer-Modus herunter).
      icon: mdi:weather-windy
      collapsed: true
      input:
        storm_enabled:
          name: Sturmschutz aktivieren
          description: Benötigt eine Wetter-Entität oder einen Wind-Sensor (unten auswählen).
          default: false
          selector:
            boolean: {}
        weather_entity:
          name: Wetter-Entität
          description: >
            Deine Wetter-Entität (z.B. von DWD oder der Standard-Integration).
            Für den Sturmschutz wird ihr wind_speed-Attribut verwendet, sofern kein
            Wind-Sensor gesetzt ist; außerdem dient sie als Temperatur-Fallback
            für den Sonnenschutz.
          default: []
          selector:
            entity:
              domain: weather
        storm_wind_sensor:
          name: Wind-Sensor (optional)
          description: >
            Alternativ zur Wetter-Entität: ein Sensor mit Windgeschwindigkeit, z.B.
            der Böen-Sensor deiner Wetterstation (Böen sind für den Sturmschutz meist
            aussagekräftiger als der Mittelwind). Wenn gesetzt, hat er Vorrang vor
            der Wetter-Entität.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: wind_speed
        wind_speed_threshold:
          name: Windgeschwindigkeit-Grenzwert
          description: >
            Ab dieser Windgeschwindigkeit wird der Sturmschutz ausgelöst (ca. 55 km/h
            empfohlen). Wichtig: Der Wert wird direkt mit dem Sensorwert bzw. dem
            wind_speed-Attribut der Wetter-Entität verglichen — liefert deine Quelle
            m/s oder mph statt km/h, muss der Grenzwert entsprechend umgerechnet werden.
          default: 55
          selector:
            number:
              min: 30
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: km/h
        panzer_mode:
          name: Panzer-Modus
          description: Wenn aktiviert, wird der Rollladen bei Sturm geschlossen statt geöffnet.
          default: false
          selector:
            boolean: {}
        force_storm_action:
          name: Aktion bei Sturm erzwingen
          description: >
            Wenn aktiviert, wird der Rollladen bei Sturm auch bewegt, wenn das Fenster
            offen ist. ⚠️ Achtung: Aussperr-Gefahr!
          default: false
          selector:
            boolean: {}
    frost_section:
      name: Frostschutz
      description: >
        Bei Frost frieren Rollladenpanzer gern im Kasten oder an der
        Führungsschiene fest — fährt der Motor dann auf Anschlag, können Gurt
        oder Lamellen reißen. Der Frostschutz begrenzt deshalb alle
        automatischen AUFWÄRTS-Fahrten (morgens, Lüften, Sonnenheizen, Sturm)
        auf eine schonende Maximal-Position, solange es friert. Schließen ist
        immer erlaubt. Aktiv, sobald ein Temperatursensor ausgewählt ist.
      icon: mdi:snowflake-thermometer
      collapsed: true
      input:
        frost_temp_sensor:
          name: Außentemperatur-Sensor (optional)
          description: >
            Frostschutz ist nur aktiv, wenn hier ein Sensor ausgewählt ist —
            es darf derselbe sein wie beim Sonnenschutz. Ist der Sensor
            nicht erreichbar, gilt "kein Frost" (normales Verhalten).
            Hinweis: Die Begrenzung braucht einen Rollladen mit
            Positionsangaben; ohne sie wird normal komplett geöffnet.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature
        frost_temp_threshold:
          name: Frost-Schwelle
          description: >
            Liegt die Außentemperatur auf oder unter diesem Wert, greift die
            Begrenzung.
          default: 0
          selector:
            number:
              min: -10
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        frost_max_position:
          name: Maximale Öffnungsposition bei Frost
          description: >
            Höher als bis zu dieser Position fährt keine automatische Fahrt,
            solange es friert — die letzten Prozent reißen den festgefrorenen
            Panzer sonst vom Fensterbrett bzw. ziehen ihn gegen den Anschlag.
          default: 90
          selector:
            number:
              min: 50
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"
    pause_section:
      name: Pausieren
      description: >
        Hält die Automation vorübergehend komplett an — z.B. während einer
        Videoaufnahme (Licht!), wenn Gäste im Zimmer schlafen oder der
        Fensterputzer da ist.
      icon: mdi:pause-circle
      collapsed: true
      input:
        pause_boolean:
          name: Pausier-Helfer (optional)
          description: >
            Ein oder mehrere input_boolean-Helfer, die die Automatik anhalten —
            keine Fahrten, keine Lichter, keine Meldungen. Ob dafür der ein- oder
            ausgeschaltete Zustand zählt, legst du im nächsten Feld fest; bei
            mehreren Helfern pausiert die Automatik nur, wenn ALLE gleichzeitig
            im Pausier-Zustand sind. Zwei Ausnahmen: Der Sturmschutz greift
            weiterhin (Hardware-Schutz geht vor), und der "Rollladen schließen"-Knopf
            einer Benachrichtigung funktioniert wie der Wandtaster — bewusste
            Befehle werden nicht blockiert. Beim Ende der Pause wird ein inzwischen
            aktiver Nachtmodus nachgeholt und die Beschattung neu bewertet;
            verpasste Einzelereignisse (z.B. das morgendliche Öffnen oder das
            Zurückfahren nach dem Lüften) werden nicht nachgeholt.
          default: []
          selector:
            entity:
              domain: input_boolean
              multiple: true
        pause_mode:
          name: Logik des Pausier-Helfers
          description: >
            Gilt für alle ausgewählten Pausier-Helfer gemeinsam. "AN pausiert"
            passt zu Helfern wie "Aufnahme läuft" — pausiert wird, wenn alle
            eingeschaltet sind. "AUS pausiert" macht die Helfer zu Aktiv-Schaltern
            fürs Dashboard (z.B. "Rollladensteuerung aktiv") — pausiert wird, wenn
            alle ausgeschaltet sind; sobald einer an ist, läuft die Automatik.
          default: on_pauses
          selector:
            select:
              mode: list
              options:
                - value: on_pauses
                  label: Helfer AN = Automatik pausiert (z.B. "Aufnahme läuft")
                - value: off_pauses
                  label: Helfer AUS = Automatik pausiert (z.B. "Rollladensteuerung aktiv")
    notification_section:
      name: Benachrichtigungen
      description: >
        Benachrichtigungen bei zu lange offenem oder gekipptem Fenster. Wird das
        Fenster geschlossen, verschwindet die Meldung automatisch vom Gerät.
        Benötigt einen Fenstersensor.
      icon: mdi:bell
      collapsed: true
      input:
        notification_device:
          name: Benachrichtigungs-Geräte
          description: Geräte mit der Home Assistant Companion App. Leer = keine Benachrichtigungen.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        notification_timeout:
          name: Benachrichtigung nach X Min. (Fenster offen)
          default: 45
          selector:
            number:
              min: 5
              max: 240
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        notification_timeout_tilted:
          name: Benachrichtigung nach X Min. (Fenster gekippt)
          default: 60
          selector:
            number:
              min: 5
              max: 480
              step: 1
              mode: slider
              unit_of_measurement: Minuten
        use_area_name:
          name: Bereichsnamen in Benachrichtigungen verwenden
          description: Wenn aktiviert, wird der Bereichsname (z.B. "Wohnzimmer") statt des Sensor-Namens verwendet.
          default: false
          selector:
            boolean: {}
        sleep_mode_boolean:
          name: Schlafmodus-Helfer (optional)
          description: Wenn dieser input_boolean 'on' ist, werden keine Benachrichtigungen gesendet.
          default: []
          selector:
            entity:
              domain: input_boolean

mode: parallel
max: 20

variables:
  cover_entity: !input cover
  window_sensor: !input window_sensor
  tilted_position: !input tilted_position
  reclose_timeout: !input reclose_timeout
  force_close: !input force_close
  treat_open_as_tilted: !input treat_open_as_tilted
  morning_enabled: !input morning_enabled
  morning_time_entity: !input morning_time
  morning_use_sun: !input morning_use_sun
  morning_sun_offset: !input morning_sun_offset
  morning_motion_sensor: !input morning_motion_sensor
  morning_position: !input morning_position
  night_mode_boolean: !input night_mode_boolean
  night_position: !input night_position
  night_ventilation_position: !input night_ventilation_position
  frost_temp_sensor: !input frost_temp_sensor
  frost_temp_threshold: !input frost_temp_threshold
  frost_max_position: !input frost_max_position
  # Frost aktiv = Sensor gesetzt, erreichbar und auf/unter der Schwelle.
  # Fallback +99: ohne (erreichbaren) Sensor gilt fail-safe "kein Frost"
  frost_active: >-
    {{ frost_temp_sensor is string
       and has_value(frost_temp_sensor)
       and states(frost_temp_sensor) | float(99) <= frost_temp_threshold }}
  shading_enable_entity: !input shading_enable_entity
  storm_enabled: !input storm_enabled
  weather_entity: !input weather_entity
  storm_wind_sensor: !input storm_wind_sensor
  wind_speed_threshold: !input wind_speed_threshold
  panzer_mode: !input panzer_mode
  force_storm_action: !input force_storm_action
  shading_status_helper: !input shading_status_helper
  window_azimuth: !input window_azimuth
  shading_fov_left: !input shading_fov_left
  shading_fov_right: !input shading_fov_right
  shading_min_elevation: !input shading_min_elevation
  window_height: !input window_height
  window_sill_height: !input window_sill_height
  shading_depth: !input shading_depth
  glass_bottom_position: !input glass_bottom_position
  glass_top_position: !input glass_top_position
  shading_min_position: !input shading_min_position
  shading_end_position: !input shading_end_position
  shading_temp_sensor: !input shading_temp_sensor
  shading_temp_threshold: !input shading_temp_threshold
  shading_temp_hysteresis: !input shading_temp_hysteresis
  shading_min_change: !input shading_min_change
  shading_override_threshold: !input shading_override_threshold
  force_shading: !input force_shading
  shading_weather_states: !input shading_weather_states
  solar_heating_status_helper: !input solar_heating_status_helper
  solar_heating_temp_threshold: !input solar_heating_temp_threshold
  solar_heating_temp_hysteresis: !input solar_heating_temp_hysteresis
  solar_heating_min_position: !input solar_heating_min_position
  solar_heating_position: !input solar_heating_position
  mosquito_area_input: !input mosquito_area
  mosquito_exclude: !input mosquito_exclude
  pause_boolean: !input pause_boolean
  pause_mode: !input pause_mode
  # Pausiert = ALLE ausgewählten Helfer stehen im Pausier-Zustand. Ältere
  # Instanzen speichern einen einzelnen Helfer als String statt Liste — beides
  # wird unterstützt. Nicht existierende/unavailable Helfer pausieren nie (fail-safe).
  pause_active: >-
    {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
    {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
    {% set found = expand(helpers) | list %}
    {{ helpers | length > 0
       and found | length > 0
       and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
  presence_entities: !input presence_entities
  away_close_enabled: !input away_close_enabled
  away_close_position: !input away_close_position
  away_shading_strict: !input away_shading_strict
  away_shading_depth: !input away_shading_depth
  # Anwesenheit pro Entität: 'home' = sicher da, 'away' = sicher weg,
  # 'unknown' = unavailable/unknown — zählt NICHT als weg (fail-safe).
  # Gleiche Logik wie im Template-Trigger away_start
  presence_states: >-
    {% set ns = namespace(out=[]) %}
    {% for e in ([presence_entities] if presence_entities is string else presence_entities) %}
      {% set st = states(e) %}
      {% set d = e.split('.')[0] %}
      {% if st in ['unavailable', 'unknown'] %}
        {% set ns.out = ns.out + ['unknown'] %}
      {% elif (d == 'zone' and st | int(1) > 0)
            or (d in ['person', 'device_tracker'] and st == 'home')
            or (d not in ['zone', 'person', 'device_tracker'] and st in ['on', 'home']) %}
        {% set ns.out = ns.out + ['home'] %}
      {% else %}
        {% set ns.out = ns.out + ['away'] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}
  presence_all_away: "{{ presence_states | length > 0 and presence_states | reject('eq', 'away') | list | length == 0 }}"
  presence_anyone_home: "{{ 'home' in presence_states }}"
  # Merker "Abwesenheit hat begonnen" (dynamische Szene, gesetzt nach Ablauf der
  # Wartezeit, entfernt beim Heimkommen). Überlebt keinen HA-Neustart — dann
  # entfallen bis zur nächsten Abwesenheit nur Wiederöffnen und strenge Beschattung
  away_marker: "scene.away_{{ cover_entity | slugify }}"
  # Bei Abwesenheit unten gehalten: Sonnenschutz und Sonnenheizen fassen den
  # Rollladen nicht an. 'closing' deckt die laufende Fahrt nach unten ab, damit
  # ein gleichzeitiger Tick das Abwesenheits-Schließen nicht abbricht
  away_hold: >-
    {{ away_close_enabled and presence_all_away
       and (state_attr(cover_entity, 'current_position') | int(101) <= away_close_position
            or is_state(cover_entity, 'closing')) }}
  sleep_mode_boolean: !input sleep_mode_boolean
  use_area_name: !input use_area_name
  notification_timeout: !input notification_timeout
  notification_timeout_tilted: !input notification_timeout_tilted
  notification_device: !input notification_device
  action_id: "{{ 'CLOSE_SHUTTER__' ~ window_sensor }}"
  notification_tag: "{{ 'fenster_offen_' ~ (window_sensor | slugify) }}"
  device_name_map: >
    {% set ns = namespace(device_names=[]) %}
    {% for device_id in notification_device %}
      {% set device_name = device_attr(device_id, "name") %}
      {% if device_name %}
        {% set ns.device_names = ns.device_names + ["mobile_app_" + device_name | slugify] %}
      {% endif %}
    {% endfor %}
    {{ ns.device_names }}

# Nur für Trigger-Templates: filtert den Notification-Action-Event bereits im
# Trigger, damit nicht jede Notification-Action jeder Instanz einen Lauf startet
trigger_variables:
  window_sensor_tv: !input window_sensor
  presence_tv: !input presence_entities

triggers:
  - trigger: time
    at: !input morning_time
    id: morning_open
    enabled: !input morning_enabled
  # Sonnenaufgangs-Variante des Morgens-Triggers. Ob sie genutzt wird,
  # entscheidet die Bedingung im Morgens-Branch (morning_use_sun) — enabled
  # akzeptiert nur ein einzelnes !input, keine Verknüpfung
  - trigger: sun
    event: sunrise
    offset:
      minutes: !input morning_sun_offset
    id: morning_open_sun
    enabled: !input morning_enabled
  # Leerer Sensor (default []) = Trigger ist valide und feuert nie.
  # Enum-Sensoren (z.B. Senoro) melden die Zustände großgeschrieben —
  # State-Trigger vergleichen exakt, daher beide Schreibweisen listen
  - trigger: state
    entity_id: !input morning_motion_sensor
    to: "on"
    id: morning_motion
    enabled: !input morning_enabled
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "on"
      - "open"
      - "Open"
      - "tilted"
      - "Tilted"
    for:
      seconds: 2
    id: window_change
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "on"
      - "open"
      - "Open"
    for:
      minutes: !input notification_timeout
    id: window_open_long
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "tilted"
      - "Tilted"
    for:
      minutes: !input notification_timeout_tilted
    id: window_tilted_long
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "off"
      - "closed"
      - "Closed"
    for:
      seconds: 2
    id: window_closed
  # Beide Richtungen, gleiche ID: Welcher Übergang die Pause beendet, hängt von
  # der gewählten Logik ab — das Gate am Aktions-Anfang sortiert den jeweils
  # anderen (Pause-Beginn) aus, weil die Pause dann gerade aktiv ist
  - trigger: state
    entity_id: !input pause_boolean
    from: "on"
    to: "off"
    id: pause_ended
  - trigger: state
    entity_id: !input pause_boolean
    from: "off"
    to: "on"
    id: pause_ended
  # from "off" explizit: Ein Template-/Binärsensor als Nachtmodus-Helfer geht
  # beim HA-Neustart unknown->on — ohne from-Filter würde jeder nächtliche
  # Neustart alle Rollläden (auch manuell geöffnete) erneut zufahren
  - trigger: state
    entity_id: !input night_mode_boolean
    from: "off"
    to: "on"
    id: night_close
  # Nachtmodus-Ende = Morgen für Schedule-Nutzer: holt ein Öffnen nach, das
  # der Nacht-Block verhindert hat (Uhrzeit/Sonnenaufgang lagen in der Nacht)
  - trigger: state
    entity_id: !input night_mode_boolean
    from: "on"
    to: "off"
    id: morning_open_night_end
    enabled: !input morning_enabled
  - trigger: numeric_state
    entity_id: !input weather_entity
    attribute: wind_speed
    above: !input wind_speed_threshold
    id: storm_detected
    enabled: !input storm_enabled
  - trigger: numeric_state
    entity_id: !input storm_wind_sensor
    above: !input wind_speed_threshold
    id: storm_detected
    enabled: !input storm_enabled
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "CLOSE_SHUTTER__{{ window_sensor_tv }}"
    id: close_shutter_action
  - trigger: time_pattern
    minutes: "/5"
    id: shading_tick
    enabled: !input shading_enabled
  - trigger: time_pattern
    minutes: "/5"
    id: solar_heating_tick
    enabled: !input solar_heating_enabled
  - trigger: state
    entity_id: !input window_sensor
    to:
      - "on"
      - "open"
      - "Open"
      - "tilted"
      - "Tilted"
    for:
      seconds: 2
    id: mosquito_lights
    enabled: !input mosquito_enabled
  # Abwesenheit beginnt: ALLE Anwesenheits-Entitäten sicher weg, und zwar
  # ununterbrochen für die Wartezeit. Template statt state-Trigger, weil
  # state-Trigger mit for: pro Entität zählen und Zonenwechsel ("Arbeit" →
  # unterwegs) die Wartezeit neu starten würden. Leere Liste: nie wahr
  - trigger: template
    value_template: >-
      {% set ents = [presence_tv] if presence_tv is string else presence_tv %}
      {% set ns = namespace(away=0) %}
      {% for e in ents %}
        {% set st = states(e) %}
        {% set d = e.split('.')[0] %}
        {% if st not in ['unavailable', 'unknown']
           and not ((d == 'zone' and st | int(1) > 0)
                    or (d in ['person', 'device_tracker'] and st == 'home')
                    or (d not in ['zone', 'person', 'device_tracker'] and st in ['on', 'home'])) %}
          {% set ns.away = ns.away + 1 %}
        {% endif %}
      {% endfor %}
      {{ ents | length > 0 and ns.away == ents | length }}
    for:
      minutes: !input away_delay
    id: away_start
  # Heimkommen: jede Zustandsänderung (ohne Attribut-Änderungen) — ob wirklich
  # jemand zurück ist und vorher eine Abwesenheit lief, prüft der Zweig
  - trigger: state
    entity_id: !input presence_entities
    to: null
    id: away_return

actions:
  # Pausier-Helfer: hält die AUTOMATIK an, mit vier Ausnahmen — Sturmschutz
  # (Hardware-Schutz geht vor), Benachrichtigungs-Aufräumen (bewegt nichts),
  # der Notification-Knopf (ein bewusster Nutzer-Befehl, wie der Wandtaster) und
  # das Heimkommen (räumt nur den Abwesenheits-Merker ab, fährt in der Pause nicht)
  - condition: >-
      {{ trigger.id | default('') in ['storm_detected', 'window_closed', 'close_shutter_action', 'away_return']
         or not pause_active }}
  - choose:
      # --- MORGENS ÖFFNEN (Uhrzeit, Sonnenaufgang oder Bewegung) ---
      - conditions:
          - condition: trigger
            id:
              - morning_open
              - morning_open_sun
              - morning_open_night_end
              - morning_motion
          # "Später von beiden" im Sonnenaufgangs-Modus: sun_gate = der effektive
          # Sonnen-Zeitpunkt (Sonnenaufgang + Offset!) ist erreicht — bewusst
          # nicht bloß above_horizon, sonst öffnet bei negativem Offset an Tagen,
          # an denen der Aufgang zwischen Untergrenze und Aufgang+|Offset| liegt,
          # GAR KEIN Trigger (Deadlock) und ein positiver Offset würde ignoriert.
          # Der heutige Sonnenaufgang wird aus next_rising abgeleitet (nach dem
          # Aufgang zeigt next_rising auf morgen -> minus 24h, ±2 min Drift egal).
          # time_gate: Uhrzeit-Untergrenze erreicht; split(' ')[-1] macht sie
          # robust gegen versehentliche Datum+Uhrzeit-Helfer.
          # Nachtmodus blockiert Uhrzeit/Sonnenaufgang; dafür holt das
          # Nachtmodus-Ende ein im Nacht-Block verpasstes Öffnen nach — aber
          # nur bei Tag bzw. am Vormittag (Winter-Frühe!), damit ein abends
          # versehentlich getoggelter Helfer nicht mitten in der Nacht öffnet.
          - >-
            {% set nr_raw = state_attr('sun.sun', 'next_rising') %}
            {% if nr_raw is none %}
              {% set sun_gate = is_state('sun.sun', 'above_horizon') %}
            {% else %}
              {% set nr = as_datetime(nr_raw) %}
              {% set sunrise_today = nr if is_state('sun.sun', 'below_horizon') else nr - timedelta(hours=24) %}
              {% set sun_gate = now() >= sunrise_today + timedelta(minutes=morning_sun_offset | int(0)) %}
            {% endif %}
            {% set time_gate = not (morning_time_entity is string
                                    and has_value(morning_time_entity)
                                    and state_attr(morning_time_entity, 'has_time'))
                               or now() >= today_at(states(morning_time_entity).split(' ')[-1]) %}
            {% set night_on = night_mode_boolean is string and is_state(night_mode_boolean, 'on') %}
            {% if trigger.id == 'morning_open' %}
              {{ (not morning_use_sun or sun_gate) and not night_on }}
            {% elif trigger.id == 'morning_open_sun' %}
              {{ morning_use_sun and time_gate and not night_on }}
            {% elif trigger.id == 'morning_open_night_end' %}
              {{ ((morning_time_entity is string and has_value(morning_time_entity)) or morning_use_sun)
                 and time_gate
                 and (not morning_use_sun or sun_gate)
                 and (is_state('sun.sun', 'above_horizon') or now() < today_at('12:00')) }}
            {% else %}
              true
            {% endif %}
          # Bewegungs-Modus (selten genutzte Räume): Mit gesetztem
          # Bewegungssensor öffnen Uhrzeit/Sonnenaufgang nicht selbst —
          # erst die erste Bewegung im Raum. Die zählt nur tagsüber, nach der
          # Uhrzeit-Untergrenze, ohne Nachtmodus, ohne laufende Beschattung
          # und nur solange der Rollladen noch (nacht-)geschlossen ist —
          # ein tagsüber bewusst geschlossener Rollladen bleibt sonst nicht zu.
          - >-
            {% if trigger.id == 'morning_motion' %}
              {{ morning_motion_sensor is string
                 and is_state('sun.sun', 'above_horizon')
                 and (not (morning_time_entity is string
                           and has_value(morning_time_entity)
                           and state_attr(morning_time_entity, 'has_time'))
                      or now() >= today_at(states(morning_time_entity).split(' ')[-1]))
                 and not (night_mode_boolean is string and is_state(night_mode_boolean, 'on'))
                 and not (shading_status_helper is string and is_state(shading_status_helper, 'on'))
                 and ((state_attr(cover_entity, 'current_position') is none
                       and (states(cover_entity) | lower) in ['closed', 'closing'])
                      or (state_attr(cover_entity, 'current_position') is not none
                          and state_attr(cover_entity, 'current_position') | int(101)
                              <= [night_position | int(0), tilted_position | int(0),
                                  night_ventilation_position | int(0), 10] | max)) }}
            {% else %}
              {{ morning_motion_sensor is not string }}
            {% endif %}
        sequence:
          # Sturm hat immer Vorrang: bei Starkwind wird morgens nicht bewegt
          # (im Panzer-Modus wäre das Öffnen direkt kontraproduktiv)
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Frostschutz: Aufwärtsfahrt bei Frost auf die schonende
              # Maximal-Position begrenzen (festgefrorener Panzer)
              morning_target: >-
                {% if frost_active %}
                  {{ [morning_position | int(100), frost_max_position | int(100)] | min }}
                {% else %}
                  {{ morning_position | int(100) }}
                {% endif %}
          - condition: "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
          - choose:
              - conditions:
                  - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < morning_target | int(100) }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: "{{ morning_target }}"
              # Fallback für Cover ohne Positions-Attribut
              - conditions:
                  - "{{ state_attr(cover_entity, 'current_position') is none }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover
          # Ein Lüftungs-Snapshot aus der Nacht ist ab jetzt veraltet: Ohne
          # diese Bereinigung würde das Fenster-Zurückfahren den Rollladen
          # nach dem Schließen wieder auf die alte Nacht-Position ziehen
          - if:
              - "{{ expand('scene.reclose_' ~ (cover_entity | slugify)) | count > 0 }}"
            then:
              - action: scene.delete
                target:
                  entity_id: "{{ 'scene.reclose_' ~ (cover_entity | slugify) }}"
          # Morgens-Öffnen ist für die Beschattung eine Fremdbewegung: Status freigeben,
          # damit ein heißer Sommermorgen direkt wieder frisch beschattet werden kann
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"

      # --- NACHTMODUS ---
      - conditions:
          - condition: trigger
            id: night_close
        sequence:
          # Beschattungs-Status zurücksetzen: Die Nacht beendet die Beschattung,
          # sonst springt der Rollladen morgens beim ersten Tick auf die End-Position
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          # Sonnenheizen-Status ebenfalls zurücksetzen, damit die nächste Aktivierung
          # (nächster sonniger kalter Morgen) nicht durch einen Alt-Zustand blockiert wird
          - if:
              - "{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ solar_heating_status_helper }}"
          - choose:
              - conditions:
                  - >-
                    {{ window_sensor is string
                       and ((states(window_sensor) | lower) == 'tilted'
                            or (treat_open_as_tilted and (states(window_sensor) | lower) in ['on', 'open'])) }}
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input tilted_position
              - conditions:
                  - "{{ window_sensor is string and (states(window_sensor) | lower) in ['on', 'open'] }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input night_ventilation_position
            default:
              # Nacht-Zielposition über 0 braucht Positionsangaben —
              # sonst (und beim Standard 0) wird komplett geschlossen
              - if:
                  - "{{ night_position | int(0) > 0 and state_attr(cover_entity, 'current_position') is not none }}"
                then:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input night_position
                else:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover

      # --- STURMSCHUTZ ---
      - conditions:
          - condition: trigger
            id: storm_detected
          - >-
            {{ force_storm_action
               or window_sensor is not string
               or (states(window_sensor) | lower) in ['off', 'closed'] }}
        sequence:
          # Beschattungs-Status zurücksetzen: Die Sturm-Bewegung darf nicht als
          # manueller Eingriff gewertet werden — sobald der Wind nachlässt, soll
          # der nächste Tick wieder frisch beschatten können
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ not panzer_mode }}"
            then:
              # Auch die Sturm-Öffnung reißt einen festgefrorenen Panzer ab —
              # bei Frost deshalb nur bis zur schonenden Maximal-Position
              - if:
                  - "{{ frost_active and state_attr(cover_entity, 'current_position') is not none }}"
                then:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input frost_max_position
                else:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover
            else:
              - action: cover.close_cover
                target:
                  entity_id: !input cover

      # --- PAUSE BEENDET: ZUSTAND NACHHOLEN ---
      - conditions:
          - condition: trigger
            id: pause_ended
          # Nur nachholen, wenn VOR diesem Helfer-Wechsel wirklich pausiert war:
          # Bei mehreren Helfern feuert der Trigger auch bei Wechseln, die die
          # (nie aktive) Pause gar nicht beendet haben — dann darf hier nichts passieren
          - >-
            {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
            {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
            {% set ns = namespace(all = helpers | length > 0) %}
            {% for h in helpers %}
              {% set st = trigger.from_state.state if h == trigger.entity_id else states(h) %}
              {% if st != pausing %}{% set ns.all = false %}{% endif %}
            {% endfor %}
            {{ ns.all }}
        sequence:
          # Beschattungs-Status freigeben: Während der Pause ist der Sollwert
          # weitergewandert — ohne Freigabe würde der erste Tick die Abweichung
          # als manuellen Eingriff werten und bis Tagesende nicht mehr beschatten
          - if:
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          # Verpassten Nachtmodus nachholen — "nachts offen" wäre der schlimmste
          # während der Pause verpasste Zustand. Sturm hat weiterhin Vorrang.
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - if:
              - "{{ night_mode_boolean is string and is_state(night_mode_boolean, 'on') }}"
              - "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
            then:
              - choose:
                  - conditions:
                      - >-
                        {{ window_sensor is string
                           and ((states(window_sensor) | lower) == 'tilted'
                                or (treat_open_as_tilted and (states(window_sensor) | lower) in ['on', 'open'])) }}
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input tilted_position
                  - conditions:
                      - "{{ window_sensor is string and (states(window_sensor) | lower) in ['on', 'open'] }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input night_ventilation_position
                default:
                  - if:
                      - "{{ night_position | int(0) > 0 and state_attr(cover_entity, 'current_position') is not none }}"
                    then:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input night_position
                    else:
                      - action: cover.close_cover
                        target:
                          entity_id: !input cover

      # --- ABWESENHEIT BEGINNT ---
      - conditions:
          - condition: trigger
            id: away_start
          - "{{ away_close_enabled or away_shading_strict }}"
          # Der Template-Trigger war für die Wartezeit wahr — trotzdem neu prüfen
          - "{{ presence_all_away }}"
        sequence:
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Schließen nur bei sicher geschlossenem Fenster (Aussperr-Schutz;
              # auch unavailable blockiert, ohne Fenstersensor gilt es als
              # geschlossen) und ohne Sturm (Sturmschutz hat Vorrang)
              close_ok: >-
                {{ away_close_enabled
                   and (not storm_enabled or (wind_now | float(0)) < wind_speed_threshold)
                   and (window_sensor is not string
                        or (states(window_sensor) | lower) in ['off', 'closed']) }}
          # Abwesenheit merken — Grundlage für Wiederöffnen und strenge Beschattung.
          # Vor dem Status-Reset, damit ein gleichzeitiger Tick nicht noch mit der
          # normalen Tiefe neu startet; fehlertolerant, das Schließen geht vor
          - action: scene.create
            continue_on_error: true
            data:
              scene_id: "{{ 'away_' ~ (cover_entity | slugify) }}"
              snapshot_entities:
                - "{{ cover_entity }}"
          # Beschattungs-Status freigeben: Das Schließen ist eine Fremdbewegung, und
          # die strenge Beschattung verschiebt die Sollposition sprunghaft — beides
          # darf der nächste Tick nicht als manuellen Eingriff werten
          - if:
              - "{{ close_ok or away_shading_strict }}"
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ close_ok }}"
            then:
              # Sonnenheizen-Status zurücksetzen wie beim Nachtmodus — solange der
              # Rollladen bei Abwesenheit unten steht, pausiert Sonnenheizen ohnehin
              - if:
                  - "{{ solar_heating_status_helper is string and is_state(solar_heating_status_helper, 'on') }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ solar_heating_status_helper }}"
              - choose:
                  # Nur abwärts fahren
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                      - "{{ state_attr(cover_entity, 'current_position') | int(-1) > away_close_position }}"
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: !input away_close_position
                  # Fallback für Cover ohne Positions-Attribut: ganz schließen
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is none }}"
                      - "{{ is_state(cover_entity, 'open') }}"
                    sequence:
                      - action: cover.close_cover
                        target:
                          entity_id: !input cover

      # --- ABWESENHEIT ENDET: JEMAND IST ZURÜCK ---
      - conditions:
          - condition: trigger
            id: away_return
          - "{{ presence_anyone_home }}"
          # Nur wenn vorher wirklich eine Abwesenheit begonnen hatte: Kurzes
          # Weg-und-zurück (unter der Wartezeit), Tracker-Aussetzer und Neustarts
          # bewegen so nichts
          - "{{ expand(away_marker) | count > 0 }}"
        sequence:
          # Merker zuerst entfernen — auch während einer Pause, sonst gälte ein
          # späteres kurzes Weg-und-zurück als Heimkommen
          - action: scene.delete
            continue_on_error: true
            target:
              entity_id: "{{ away_marker }}"
          # Fahren und Status-Änderungen nur ohne Pause
          - condition: "{{ not pause_active }}"
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              # Rollladen wurde bei Abwesenheit unten gehalten: steht noch auf/unter
              # der Abwesenheits-Position oder fährt gerade dorthin
              was_held: >-
                {% set pos = state_attr(cover_entity, 'current_position') %}
                {{ away_close_enabled
                   and ((pos is not none and pos | int(101) <= away_close_position)
                        or (pos is none and is_state(cover_entity, 'closed'))
                        or is_state(cover_entity, 'closing')) }}
              # Bewegungs-Modus des Morgens-Öffnens (selten genutzter Raum): Die
              # erste Bewegung im Raum öffnet den Rollladen, wenn er so tief steht,
              # wie dessen Bedingung verlangt (gleiche Grenze wie im Morgens-Zweig).
              # Dann überlässt das Heimkommen ihr das Öffnen; steht er höher (z.B.
              # Abwesenheits-Position über der Grenze), öffnete an diesem Tag sonst
              # nichts mehr — dann öffnet das Heimkommen wie ohne Bewegungs-Modus
              motion_opens: >-
                {{ morning_enabled
                   and morning_motion_sensor is string
                   and ((state_attr(cover_entity, 'current_position') is none
                         and (states(cover_entity) | lower) in ['closed', 'closing'])
                        or (state_attr(cover_entity, 'current_position') is not none
                            and state_attr(cover_entity, 'current_position') | int(101)
                                <= [night_position | int(0), tilted_position | int(0),
                                    night_ventilation_position | int(0), 10] | max)) }}
              # Wieder öffnen nur, wenn es weder Nacht noch dunkel ist (beim
              # Heimkommen soll Tageslicht rein, abends bleibt er zu) und kein
              # Sturm herrscht
              open_ok: >-
                {{ was_held
                   and not motion_opens
                   and not (night_mode_boolean is string and is_state(night_mode_boolean, 'on'))
                   and not is_state('sun.sun', 'below_horizon')
                   and (not storm_enabled or (wind_now | float(0)) < wind_speed_threshold) }}
              # Frostschutz: Aufwärtsfahrt bei Frost auf die schonende
              # Maximal-Position begrenzen (festgefrorener Panzer) — wie morgens
              return_target: >-
                {% if frost_active %}
                  {{ [morning_position | int(100), frost_max_position | int(100)] | min }}
                {% else %}
                  {{ morning_position | int(100) }}
                {% endif %}
          # Beschattungs-Status freigeben: Wiederöffnen ist eine Fremdbewegung, nach
          # strenger Beschattung gilt wieder die normale Sollposition, und ein
          # während des Unten-Haltens aufgeschobenes Beschattungs-Ende darf nicht
          # nachträglich (womöglich im Dunkeln) noch öffnen
          - if:
              - "{{ was_held or away_shading_strict }}"
              - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ shading_status_helper }}"
          - if:
              - "{{ open_ok }}"
            then:
              - choose:
                  # Nur aufwärts fahren — oder eine noch laufende Abwärtsfahrt abfangen
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is not none }}"
                      - >-
                        {{ state_attr(cover_entity, 'current_position') | int(101) < return_target | int(100)
                           or is_state(cover_entity, 'closing') }}
                    sequence:
                      - action: cover.set_cover_position
                        target:
                          entity_id: !input cover
                        data:
                          position: "{{ return_target }}"
                  # Fallback für Cover ohne Positions-Attribut
                  - conditions:
                      - "{{ state_attr(cover_entity, 'current_position') is none }}"
                    sequence:
                      - action: cover.open_cover
                        target:
                          entity_id: !input cover

      # --- SONNENSCHUTZ ---
      - conditions:
          - condition: trigger
            id: shading_tick
        sequence:
          # Fehlkonfiguration laut machen: Blueprints kennen keine bedingten
          # Pflichtfelder — ohne diesen Hinweis bliebe ein aktivierter Sonnenschutz
          # ohne Status-Helfer einfach still wirkungslos
          - if:
              - "{{ shading_status_helper is not string }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "rollladen_helfer_fehlt_{{ cover_entity | slugify }}"
                  title: "Rollladensteuerung: Status-Helfer fehlt"
                  message: >-
                    Der Sonnenschutz für "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}"
                    ist aktiviert, aber es ist kein Status-Helfer (input_boolean)
                    ausgewählt — die Beschattung bleibt dadurch wirkungslos.
                    Bitte in der Automation einen Helfer auswählen oder den
                    Sonnenschutz deaktivieren.
              - stop: "Sonnenschutz aktiviert, aber kein Status-Helfer konfiguriert"
          # Bei Abwesenheit unten gehalten: weder beschatten noch (Ende) öffnen
          - condition: "{{ not away_hold }}"
          - variables:
              sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
              sun_azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
              az_diff: "{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}"
              sun_in_window: >-
                {{ sun_elevation >= shading_min_elevation
                   and az_diff >= (0 - shading_fov_left)
                   and az_diff <= shading_fov_right }}
              outdoor_temp: >-
                {% if shading_temp_sensor is string %}
                  {{ states(shading_temp_sensor) | float(-99) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'temperature') | float(-99) }}
                {% else %}
                  -99
                {% endif %}
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_ok: "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
              # Ist die Temperaturquelle gerade verfügbar? Ein kurzer unavailable-Blip
              # (Integrations-Reload, Funk-Aussetzer) darf eine laufende Beschattung
              # nicht beenden — unavailable heißt "Zustand halten", nicht "abbrechen"
              temp_available: >-
                {% if shading_temp_sensor is string %}
                  {{ has_value(shading_temp_sensor) }}
                {% elif weather_entity is string %}
                  {{ has_value(weather_entity) and state_attr(weather_entity, 'temperature') is not none }}
                {% else %}
                  false
                {% endif %}
              # Wetterlagen-Filter: ohne Auswahl (leer) immer erlaubt (Altverhalten,
              # rein auf Sonnenstand/Temperatur basierend); ohne gesetzte Wetter-Entität
              # oder bei unavailable/unknown ebenfalls erlaubt (Filter kann nicht
              # ausgewertet werden und soll die Beschattung dann nicht lahmlegen)
              weather_ok: >-
                {{ shading_weather_states | length == 0
                   or not (weather_entity is string)
                   or states(weather_entity) in ['unknown', 'unavailable']
                   or states(weather_entity) in shading_weather_states }}
              # Beenden nur bei STABIL schlechter Wetterlage (>= 10 Minuten unverändert):
              # Wetterzustände flattern gern (bewölkt <-> teilweise bewölkt) — ohne diese
              # Trägheit würde der Rollladen im 5-Minuten-Takt voll auf- und zufahren.
              # Bewusster Trade-off: Flattert das Wetter zwischen zwei NICHT erlaubten
              # Lagen (z.B. rainy <-> pouring), bleibt last_changed jung und dieses
              # Ende greift nicht — dann beenden Sonnenstand/Temperatur die Beschattung
              weather_bad_stable: >-
                {{ shading_weather_states | length > 0
                   and weather_entity is string
                   and states(weather_entity) not in ['unknown', 'unavailable']
                   and states(weather_entity) not in shading_weather_states
                   and (as_timestamp(now()) - as_timestamp(states[weather_entity].last_changed)) > 600 }}
              # Freigabe-Entität (PV, Lux, Anwesenheit, …): ohne gesetzte Entität
              # immer erlaubt; bei unavailable startet nichts Neues (kein is_state-
              # Treffer), eine laufende Beschattung läuft aber weiter
              enable_ok: >-
                {{ shading_enable_entity is not string
                   or is_state(shading_enable_entity, 'on') }}
              # Beenden nur bei STABIL ausgeschalteter Freigabe (>= 10 Minuten) —
              # gleiche Trägheit wie beim Wetterlagen-Filter, damit eine flatternde
              # PV-/Lux-Quelle den Rollladen nicht im 5-Minuten-Takt fahren lässt
              enable_off_stable: >-
                {{ shading_enable_entity is string
                   and states(shading_enable_entity) == 'off'
                   and (as_timestamp(now()) - as_timestamp(states[shading_enable_entity].last_changed)) > 600 }}
              # Strengere Beschattung, solange eine Abwesenheit läuft (Merker gesetzt
              # und niemand zurück); nie lockerer als die normale Einfall-Tiefe
              shading_depth_now: >-
                {{ [away_shading_depth, shading_depth] | min
                   if away_shading_strict and not presence_anyone_home and expand(away_marker) | count > 0
                   else shading_depth }}
          - choose:
              # Beschattung starten / der Sonne nachführen
              - conditions:
                  - "{{ sun_in_window and outdoor_temp >= shading_temp_threshold }}"
                  - "{{ storm_ok }}"
                  - "{{ weather_ok }}"
                  - "{{ enable_ok }}"
                  - "{{ not (night_mode_boolean is string and is_state(night_mode_boolean, 'on')) }}"
                  - >-
                    {{ force_shading
                       or treat_open_as_tilted
                       or window_sensor is not string
                       or (states(window_sensor) | lower) not in ['on', 'open'] }}
                sequence:
                  - variables:
                      # Höhe (über dem Boden), auf der ein Sonnenstrahl die Fensterebene
                      # durchqueren darf, damit er maximal shading_depth_now tief in den Raum fällt
                      ray_height: >-
                        {{ shading_depth_now * tan(sun_elevation * pi / 180)
                           / ([cos(az_diff * pi / 180), 0.087] | max) }}
                      target_position: >-
                        {% set glass_free = [[(ray_height - window_sill_height) / window_height * 100, 0] | max, 100] | min %}
                        {% set a = glass_bottom_position | int(0) %}
                        {% set b = glass_top_position | int(100) %}
                        {% if b <= a %}{% set a = 0 %}{% set b = 100 %}{% endif %}
                        {% set p = (a + glass_free * (b - a) / 100) | round(0) | int %}
                        {% set p = [p, shading_min_position | int] | max %}
                        {% set p = [p, 100] | min %}
                        {% if window_sensor is string and (states(window_sensor) | lower) in ['tilted', 'on', 'open'] %}
                          {{ [p, tilted_position | int] | max }}
                        {% else %}
                          {{ p }}
                        {% endif %}
                      current_position: "{{ state_attr(cover_entity, 'current_position') | int(-1) }}"
                  - condition: "{{ current_position >= 0 }}"
                  - variables:
                      deviation: "{{ (current_position - target_position | int) | abs }}"
                  - if:
                      - "{{ is_state(shading_status_helper, 'on') }}"
                    then:
                      # Beschattung läuft bereits: nur kleine Abweichungen nachführen.
                      # Große Abweichungen können nicht vom Sonnenstand kommen (der
                      # wandert pro Tick nur wenige Prozent) — das war ein manueller
                      # Eingriff und wird bis zum Beschattungs-Ende respektiert.
                      - if:
                          - "{{ deviation >= shading_min_change and deviation <= shading_override_threshold }}"
                        then:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ target_position }}"
                    else:
                      # Beschattung beginnt: Anfangsbewegung immer ausführen
                      - action: input_boolean.turn_on
                        target:
                          entity_id: "{{ shading_status_helper }}"
                      - if:
                          - "{{ deviation >= shading_min_change }}"
                        then:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: "{{ target_position }}"
              # Beschattung beenden
              - conditions:
                  - "{{ is_state(shading_status_helper, 'on') }}"
                  - >-
                    {{ (not sun_in_window)
                       or (temp_available and outdoor_temp <= (shading_temp_threshold - shading_temp_hysteresis))
                       or weather_bad_stable
                       or enable_off_stable }}
                  - "{{ not (night_mode_boolean is string and is_state(night_mode_boolean, 'on')) }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ shading_status_helper }}"
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input shading_end_position

      # --- SONNENHEIZEN (Winter) ---
      - conditions:
          - condition: trigger
            id: solar_heating_tick
        sequence:
          - if:
              - "{{ solar_heating_status_helper is not string }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "rollladen_heizhelfer_fehlt_{{ cover_entity | slugify }}"
                  title: "Rollladensteuerung: Status-Helfer fehlt"
                  message: >-
                    Sonnenheizen für "{{ state_attr(cover_entity, 'friendly_name') or cover_entity }}"
                    ist aktiviert, aber es ist kein eigener Status-Helfer (input_boolean)
                    ausgewählt — das Feature bleibt dadurch wirkungslos.
                    Bitte in der Automation einen Helfer auswählen oder Sonnenheizen
                    deaktivieren.
              - stop: "Sonnenheizen aktiviert, aber kein Status-Helfer konfiguriert"
          # Bei Abwesenheit unten gehalten: nicht öffnen (Sichtschutz geht vor)
          - condition: "{{ not away_hold }}"
          - variables:
              sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
              sun_azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
              az_diff: "{{ ((sun_azimuth - window_azimuth + 180) % 360) - 180 }}"
              sun_in_window: >-
                {{ sun_elevation >= shading_min_elevation
                   and az_diff >= (0 - shading_fov_left)
                   and az_diff <= shading_fov_right }}
              # Fallback +99 (statt -99 wie beim Sonnenschutz): fehlt die
              # Temperaturquelle, soll die "<= Schwelle"-Prüfung sicher scheitern,
              # damit Sonnenheizen ohne Datenquelle einfach aus bleibt statt zu spinnen
              outdoor_temp: >-
                {% if shading_temp_sensor is string %}
                  {{ states(shading_temp_sensor) | float(99) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'temperature') | float(99) }}
                {% else %}
                  99
                {% endif %}
              # Ein unavailable-Blip der Temperaturquelle darf die Einmal-Semantik
              # nicht brechen (sonst: Helfer-Reset -> erneutes Aufdrängen nach Blip)
              temp_available: >-
                {% if shading_temp_sensor is string %}
                  {{ has_value(shading_temp_sensor) }}
                {% elif weather_entity is string %}
                  {{ has_value(weather_entity) and state_attr(weather_entity, 'temperature') is not none }}
                {% else %}
                  false
                {% endif %}
              night_mode_on: "{{ night_mode_boolean is string and is_state(night_mode_boolean, 'on') }}"
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_ok: "{{ not storm_enabled or (wind_now | float(0)) < wind_speed_threshold }}"
          - choose:
              # Sonnenheizen starten: heruntergelassenen Rollladen öffnen.
              # Der Sturmschutz hat immer Vorrang: bei Starkwind wird nicht geöffnet
              # (im Panzer-Modus wäre das direkt kontraproduktiv)
              - conditions:
                  - "{{ not is_state(solar_heating_status_helper, 'on') }}"
                  - "{{ sun_in_window and outdoor_temp <= solar_heating_temp_threshold }}"
                  - "{{ not night_mode_on }}"
                  - "{{ storm_ok }}"
                  - >-
                    {{ state_attr(cover_entity, 'current_position') is not none
                       and state_attr(cover_entity, 'current_position') | int(101) < solar_heating_min_position }}
                sequence:
                  # Helfer zuerst setzen: verhindert, dass ein manuelles Wieder-Runterfahren
                  # im selben Zeitraum sofort erneut aufgedrängt wird (kein Ping-Pong)
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ solar_heating_status_helper }}"
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      # Sonnenheizen trifft naturgemäß auf kalte Morgen — bei Frost
                      # nur bis zur schonenden Maximal-Position öffnen
                      position: >-
                        {% if frost_active %}
                          {{ [solar_heating_position | int(100), frost_max_position | int(100)] | min }}
                        {% else %}
                          {{ solar_heating_position | int(100) }}
                        {% endif %}
              # Sonnenheizen beenden: nur Status zurücksetzen, kein erzwungenes Schließen —
              # der Rollladen bleibt offen, bis Nachtmodus/Fenster-Interaktion ihn regulär bewegen
              - conditions:
                  - "{{ is_state(solar_heating_status_helper, 'on') }}"
                  - >-
                    {{ (not sun_in_window)
                       or (temp_available and outdoor_temp >= (solar_heating_temp_threshold + solar_heating_temp_hysteresis))
                       or night_mode_on }}
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: "{{ solar_heating_status_helper }}"

      # --- MOSKITO-MODUS: LICHTER AUS ---
      - conditions:
          - condition: trigger
            id: mosquito_lights
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          - condition: time
            after: !input mosquito_after_time
        sequence:
          - variables:
              mosquito_area: >-
                {{ mosquito_area_input if mosquito_area_input is string and mosquito_area_input
                   else area_id(window_sensor) }}
              lights_to_turn_off: >-
                {% if mosquito_area %}
                  {{ expand(area_entities(mosquito_area))
                     | selectattr('domain', 'eq', 'light')
                     | selectattr('state', 'eq', 'on')
                     | map(attribute='entity_id')
                     | reject('in', mosquito_exclude)
                     | list }}
                {% else %}
                  {{ [] }}
                {% endif %}
          - condition: "{{ lights_to_turn_off | length > 0 }}"
          - action: light.turn_off
            target:
              entity_id: "{{ lights_to_turn_off }}"

      # --- BENACHRICHTIGUNG: FENSTER LANGE OFFEN/GEKIPPT ---
      - conditions:
          - condition: trigger
            id:
              - window_open_long
              - window_tilted_long
          - "{{ not (sleep_mode_boolean is string and is_state(sleep_mode_boolean, 'on')) }}"
          - "{{ device_name_map | length > 0 }}"
        sequence:
          - variables:
              state_word: "{{ 'offen' if trigger.id == 'window_open_long' else 'gekippt' }}"
              timeout_used: "{{ notification_timeout if trigger.id == 'window_open_long' else notification_timeout_tilted }}"
              has_area: "{{ use_area_name and area_name(window_sensor) is not none }}"
              window_label: >-
                {%- if has_area -%}
                  {{ area_name(window_sensor) }}
                {%- else -%}
                  {{ state_attr(window_sensor, 'friendly_name') or window_sensor }}
                {%- endif -%}
              title_text: >-
                {%- if has_area -%}
                  Fenster {{ state_word }} in {{ window_label }}
                {%- else -%}
                  Fenster {{ state_word }}
                {%- endif -%}
              message_text: >-
                {%- if has_area -%}
                  Das Fenster im Bereich '{{ window_label }}' ist seit über {{ timeout_used }} Minuten {{ state_word }}.
                {%- else -%}
                  Fenster '{{ window_label }}' ist seit über {{ timeout_used }} Minuten {{ state_word }}.
                {%- endif -%}
          - repeat:
              for_each: "{{ device_name_map }}"
              sequence:
                # Ein einzelnes umbenanntes/entferntes Gerät darf den Versand an
                # die übrigen Geräte nicht abbrechen
                - action: "notify.{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ title_text }}"
                    message: "{{ message_text }}"
                    data:
                      # Gleicher Tag pro Fenster: "gekippt" ersetzt eine ältere
                      # "offen"-Meldung, und das Schließen räumt sie wieder ab
                      tag: "{{ notification_tag }}"
                      actions:
                        - action: "{{ action_id }}"
                          title: Rollladen schließen

      # --- FENSTER WIEDER ZU: BENACHRICHTIGUNG ABRÄUMEN + NACHT NACHHOLEN ---
      - conditions:
          - condition: trigger
            id: window_closed
        sequence:
          - if:
              - "{{ device_name_map | length > 0 }}"
            then:
              - repeat:
                  for_each: "{{ device_name_map }}"
                  sequence:
                    - action: "notify.{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        message: clear_notification
                        data:
                          tag: "{{ notification_tag }}"
          # Nachtmodus nachholen: Blieb das Fenster länger offen als das
          # Rückfahr-Zeitfenster, gibt es keinen wartenden Lauf mehr, der beim
          # Schließen reagiert — der Rollladen bliebe sonst die ganze Nacht in
          # der Lüftungsposition stehen. Läuft der wartende Lauf noch, kommen
          # beide zum selben Ergebnis (Schließen) — das ist unkritisch.
          # window_closed ist von der Pausen-Ausnahme fürs Aufräumen erfasst,
          # deshalb wird die Pause hier explizit geprüft; Sturm hat Vorrang.
          - variables:
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
          - if:
              - "{{ night_mode_boolean is string and is_state(night_mode_boolean, 'on') }}"
              # Nur nach einem ECHTEN Schließ-Vorgang nachziehen: Ein Sensor-Blip
              # (unavailable -> closed bei Zigbee-Reconnect oder Integrations-Reload)
              # darf einen nachts bewusst manuell geöffneten Rollladen nicht zufahren
              - >-
                {{ trigger.from_state is not none
                   and (trigger.from_state.state | lower) in ['on', 'open', 'tilted'] }}
              - "{{ not pause_active }}"
              - "{{ not (storm_enabled and not panzer_mode and (wind_now | float(0)) >= wind_speed_threshold) }}"
            then:
              - if:
                  - "{{ night_position | int(0) > 0 and state_attr(cover_entity, 'current_position') is not none }}"
                then:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input night_position
                else:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover

      # --- NOTIFICATION-ACTION: ROLLLADEN SCHLIESSEN ---
      - conditions:
          - condition: trigger
            id: close_shutter_action
          - "{{ trigger.event.data.action == action_id }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: !input cover

      # --- FENSTER-INTERAKTION (KIPPEN/ÖFFNEN + ZURÜCKFAHREN) ---
      - conditions:
          - condition: trigger
            id: window_change
        sequence:
          - variables:
              night_mode_on: "{{ night_mode_boolean is string and is_state(night_mode_boolean, 'on') }}"
              reclose_scene: "scene.reclose_{{ cover_entity | slugify }}"
          # Ausgangsposition nur beim Übergang aus "geschlossen" sichern — sonst
          # überschreibt Kippen→Öffnen den Snapshot mit der Kipp-Position. Nach
          # unavailable/unknown nur sichern, wenn noch KEIN Snapshot existiert:
          # nach einem HA-Neustart fehlt er (Szene weg), aber bei einem Sensor-Blip
          # am offenen Fenster würde er sonst mit der Offen-Position überschrieben
          - if:
              - >-
                {{ trigger.from_state is not none
                   and ((trigger.from_state.state | lower) in ['off', 'closed']
                        or (trigger.from_state.state in ['unavailable', 'unknown']
                            and expand(reclose_scene) | count == 0)) }}
            then:
              - action: scene.create
                data:
                  scene_id: "{{ 'reclose_' ~ (cover_entity | slugify) }}"
                  snapshot_entities:
                    - "{{ cover_entity }}"
          - choose:
              - conditions:
                  - >-
                    {{ (trigger.to_state.state | lower) == 'tilted'
                       or (treat_open_as_tilted and (trigger.to_state.state | lower) in ['on', 'open']) }}
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < tilted_position }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input tilted_position
              - conditions:
                  - "{{ (trigger.to_state.state | lower) in ['on', 'open'] }}"
                  - "{{ not treat_open_as_tilted }}"
                  - "{{ not night_mode_on }}"
                  # Bei aktiver erzwungener Beschattung bleibt der Rollladen unten
                  - "{{ not (force_shading and shading_status_helper is string and is_state(shading_status_helper, 'on')) }}"
                sequence:
                  # Bei Frost nur bis zur schonenden Maximal-Position öffnen
                  - if:
                      - "{{ frost_active and state_attr(cover_entity, 'current_position') is not none }}"
                    then:
                      - if:
                          - "{{ state_attr(cover_entity, 'current_position') | int(101) < frost_max_position | int(100) }}"
                        then:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input frost_max_position
                    else:
                      - action: cover.open_cover
                        target:
                          entity_id: !input cover
                  # Beschattungs-Status freigeben: Das Öffnen fürs Lüften ist kein
                  # manueller Eingriff — nach dem Schließen (oder Timeout) darf der
                  # nächste Tick wieder beschatten, statt bis Tagesende zu pausieren
                  - if:
                      - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                    then:
                      - action: input_boolean.turn_off
                        target:
                          entity_id: "{{ shading_status_helper }}"
              # Nachts nur bis zur Lüftungsposition öffnen statt komplett
              - conditions:
                  - "{{ (trigger.to_state.state | lower) in ['on', 'open'] }}"
                  - "{{ not treat_open_as_tilted }}"
                  - "{{ night_mode_on }}"
                  - "{{ state_attr(cover_entity, 'current_position') | int(101) < night_ventilation_position }}"
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: !input cover
                    data:
                      position: !input night_ventilation_position
          - wait_for_trigger:
              - trigger: state
                entity_id: !input window_sensor
                to:
                  - "off"
                  - "closed"
                  - "Closed"
                for:
                  seconds: 2
            timeout:
              minutes: !input reclose_timeout
            continue_on_timeout: true
          # Zustand NACH dem Warten neu bewerten — währenddessen können Nachtmodus
          # oder Sturm aktiv geworden sein, dann darf der Snapshot nicht zurückgeholt werden
          - variables:
              night_mode_on_now: "{{ night_mode_boolean is string and is_state(night_mode_boolean, 'on') }}"
              pause_now: >-
                {% set helpers = [pause_boolean] if pause_boolean is string else pause_boolean %}
                {% set pausing = 'on' if pause_mode == 'on_pauses' else 'off' %}
                {% set found = expand(helpers) | list %}
                {{ helpers | length > 0
                   and found | length > 0
                   and found | rejectattr('state', 'eq', pausing) | list | length == 0 }}
              wind_now: >-
                {% if storm_wind_sensor is string %}
                  {{ states(storm_wind_sensor) | float(0) }}
                {% elif weather_entity is string %}
                  {{ state_attr(weather_entity, 'wind_speed') | float(0) }}
                {% else %}
                  0
                {% endif %}
              storm_now: "{{ storm_enabled and (wind_now | float(0)) >= wind_speed_threshold }}"
          - if:
              - "{{ wait.trigger is none }}"
            then:
              - if:
                  - "{{ force_close }}"
                  # Während der Pause wird auch nach Timeout nichts bewegt
                  - "{{ not pause_now }}"
                then:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover
            else:
              - choose:
                  # Fenster zu + Nachtmodus inzwischen aktiv → schließen statt restaurieren
                  - conditions:
                      - "{{ night_mode_on_now }}"
                      - "{{ not pause_now }}"
                    sequence:
                      - if:
                          - "{{ night_position | int(0) > 0 and state_attr(cover_entity, 'current_position') is not none }}"
                        then:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover
                            data:
                              position: !input night_position
                        else:
                          - action: cover.close_cover
                            target:
                              entity_id: !input cover
                  # Normalfall: Ausgangsposition wiederherstellen (nur wenn der
                  # Snapshot existiert, kein Sturm aktiv ist und keine Pause läuft).
                  # Existenz via expand
                  # prüfen — der State einer Szene ist ihr letzter Aktivierungs-
                  # Zeitstempel und steht bei nie aktivierten Szenen dauerhaft auf
                  # 'unknown'; ein State-Check würde den ersten Restore für immer blockieren
                  - conditions:
                      - "{{ not storm_now }}"
                      - "{{ not pause_now }}"
                      - "{{ expand(reclose_scene) | count > 0 }}"
                    sequence:
                      - action: scene.turn_on
                        target:
                          entity_id: "{{ reclose_scene }}"
                      # Restore ist eine Fremdbewegung: Beschattungs-Status freigeben,
                      # damit der nächste Tick bei Bedarf frisch beschattet, statt die
                      # Abweichung als manuellen Eingriff bis Tagesende zu sperren
                      - if:
                          - "{{ shading_status_helper is string and is_state(shading_status_helper, 'on') }}"
                        then:
                          - action: input_boolean.turn_off
                            target:
                              entity_id: "{{ shading_status_helper }}"
