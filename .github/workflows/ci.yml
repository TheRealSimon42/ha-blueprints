name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint blueprints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install --quiet yamllint pyyaml

      - name: yamllint
        if: ${{ !cancelled() }}
        run: yamllint .

      - name: Prettier (check only)
        if: ${{ !cancelled() }}
        run: npx --yes prettier@3.5 --check .

      # Semantische Blueprint-Pruefung (siehe skills/ha-blueprint-dev)
      - name: Blueprint linter
        if: ${{ !cancelled() }}
        run: |
          for f in automations/*.yaml; do
            python3 skills/ha-blueprint-dev/scripts/validate_blueprint.py "$f"
          done
